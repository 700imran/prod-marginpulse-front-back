groups:
  - name: marginpulse-api
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations: { summary: "More than 2% of API requests are failing with 5xx", runbook: "observability/README.md#runbook" }
      - alert: ApiSlowP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "API p95 latency above 1s for 10 minutes" }
      - alert: ApiNoTelemetry
        expr: absent_over_time(http_server_request_duration_seconds_count[15m])
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "No API metrics received for 15 min: Worker down, no traffic, or the collector/OTLP secret is broken" }
  - name: marginpulse-business-security
    rules:
      - alert: PaymentVerificationFailures
        expr: sum(increase(marginpulse_events_total{event="payment",outcome=~"bad_signature|owner_mismatch|not_paid|gateway_error"}[15m])) > 5
        labels: { severity: page }
        annotations: { summary: "Several payment verifications failed in 15 min (bad signature, foreign order, unpaid or gateway error). Check Razorpay status and secrets." }
      - alert: PaymentGatewayErrors
        expr: sum(increase(marginpulse_events_total{event="payment",outcome="gateway_error"}[10m])) > 2
        labels: { severity: page }
        annotations: { summary: "Razorpay order lookups are failing" }
      - alert: AuthFailureSpike
        expr: sum(rate(marginpulse_events_total{event="auth_failed"}[5m])) > 5
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Sustained failed-authentication traffic (possible token stuffing)" }
      - alert: RateLimitingSpike
        expr: sum(rate(marginpulse_events_total{event="rate_limited"}[5m])) > 2
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Clients are being rate limited continuously" }
      - alert: WebhookRejections
        expr: sum(increase(marginpulse_events_total{event="webhook_rejected"}[15m])) > 3
        labels: { severity: warn }
        annotations: { summary: "Webhook calls rejected (wrong secret/signature): misconfiguration or probing" }
  - name: marginpulse-user-experience
    rules:
      - alert: RefreshSlow
        expr: histogram_quantile(0.75, sum by (le) (rate(marginpulse_web_vital_milliseconds_bucket{name="APP_READY"}[30m]))) > 2000
        for: 30m
        labels: { severity: warn }
        annotations: { summary: "p75 time-to-usable after page refresh above 2s" }
      - alert: WarmFeatureSlow
        expr: histogram_quantile(0.75, sum by (le) (rate(marginpulse_feature_load_milliseconds_bucket{temp="warm"}[30m]))) > 400
        for: 30m
        labels: { severity: warn }
        annotations: { summary: "p75 time to open an already-visited feature above 400 ms (target: instant)" }
      - alert: SlowLCP
        expr: histogram_quantile(0.75, sum by (le) (rate(marginpulse_web_vital_milliseconds_bucket{name="LCP"}[30m]))) > 2500
        for: 30m
        labels: { severity: warn }
        annotations: { summary: "p75 Largest Contentful Paint above 2.5s" }
      - alert: BrowserErrorsRising
        expr: sum(rate(marginpulse_events_total{event="js_error"}[10m])) * 60 > 1
        for: 15m
        labels: { severity: warn }
        annotations: { summary: "More than 1 browser JS error per minute" }
