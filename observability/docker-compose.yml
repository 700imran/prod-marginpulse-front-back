# Self-hosted telemetry stack:  Worker --OTLP--> Collector --> Prometheus --> Grafana (+ Tempo for traces)
#   OTLP_AUTH_TOKEN=$(openssl rand -hex 32) GRAFANA_ADMIN_PASSWORD='choose-a-strong-one' docker compose up -d
# Then: wrangler secret put OTLP_ENDPOINT   (https://<your-collector-host>)
#       wrangler secret put OTLP_HEADERS    (Authorization=Bearer <OTLP_AUTH_TOKEN>)
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      OTLP_AUTH_TOKEN: ${OTLP_AUTH_TOKEN:?set OTLP_AUTH_TOKEN}
    volumes: ["./otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]   # expose publicly ONLY through a TLS proxy / tunnel
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo]
    restart: unless-stopped
volumes: { prom-data: {}, tempo-data: {}, grafana-data: {} }
