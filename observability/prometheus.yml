global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # WhatsApp gateway sidecar (extensions/whatsapp-gateway) is a long-lived process, so unlike the Worker it CAN be scraped.
  # Uncomment once it is deployed; put its WA_GATEWAY_TOKEN in observability/secrets/wa-gateway-token (mounted by docker-compose.yml).
  # - job_name: whatsapp-gateway
  #   metrics_path: /metrics
  #   authorization: { type: Bearer, credentials_file: /etc/prometheus/wa-gateway-token }
  #   static_configs:
  #     - targets: ["host.docker.internal:8787"]
