name = "marginpulse-api"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# R2 — replaces S3 (marginpulse-documents bucket)
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "marginpulse-documents"

# ---------------------------------------------------------------------------
# Hyperdrive — pooled connection to Supabase Postgres.
# Create with:
#   wrangler hyperdrive create marginpulse-db \
#     --connection-string="postgres://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres"
# Use the Supabase *transaction pooler* (port 6543) connection string, not
# the direct :5432 one — Hyperdrive expects to sit in front of a pooler-
# friendly endpoint, and Supabase's pooler already speaks pgbouncer.
# ---------------------------------------------------------------------------
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

# ---------------------------------------------------------------------------
# Queues — replace the 5 SQS queues in infra/worker-template.yaml 1:1
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "OCR_QUEUE"
queue = "marginpulse-ocr"

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "marginpulse-reconcile"

[[queues.producers]]
binding = "GST_QUEUE"
queue = "marginpulse-gst"

[[queues.producers]]
binding = "TAX_IDENTIFIER_QUEUE"
queue = "marginpulse-tax-identifier"

[[queues.producers]]
binding = "BANK_ACCOUNT_QUEUE"
queue = "marginpulse-bank-account"

# One consumer Worker drains all 5 — src/queue/consumer.ts dispatches on
# the "task" field, same as cmd/worker/main.go's switch did.
[[queues.consumers]]
queue = "marginpulse-ocr"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "marginpulse-ocr-dlq"

[[queues.consumers]]
queue = "marginpulse-reconcile"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "marginpulse-reconcile-dlq"

[[queues.consumers]]
queue = "marginpulse-gst"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "marginpulse-gst-dlq"

[[queues.consumers]]
queue = "marginpulse-tax-identifier"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "marginpulse-tax-identifier-dlq"

[[queues.consumers]]
queue = "marginpulse-bank-account"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "marginpulse-bank-account-dlq"

# ---------------------------------------------------------------------------
# Cron Triggers — replaces the never-built EventBridge rules from ROADMAP.md
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 3 * * *"]  # daily: detect-missing-invoices sweep across tenants

# ---------------------------------------------------------------------------
# Non-secret env vars. Everything sensitive goes via `wrangler secret put`:
#   SUPABASE_JWT_SECRET, SUPABASE_SERVICE_ROLE_KEY, FIELD_ENCRYPTION_KEY,
#   UPSTASH_REDIS_REST_TOKEN, ANTHROPIC_API_KEY, GST_API_KEY,
#   RAZORPAY_KEY_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   SLACK_CLIENT_SECRET, OCR_LAMBDA_AUTH_TOKEN, RESEND_API_KEY,
#   WHATSAPP_VERIFY_TOKEN, WHATSAPP_ACCESS_TOKEN, WHATSAPP_APP_SECRET,
#   WEBHOOK_INGEST_SECRET
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://REPLACE.supabase.co"
UPSTASH_REDIS_REST_URL = "https://REPLACE.upstash.io"
OCR_LAMBDA_URL = "https://REPLACE.lambda-url.ap-south-1.on.aws/"
GST_API_BASE_URL = "https://REPLACE-gst-portal-provider.example.com"
ANTHROPIC_API_BASE_URL = "https://api.anthropic.com"
ANTHROPIC_MODEL = "claude-sonnet-4-20250514"
LLM_MAX_TOKENS = "1024"
AI_MAX_PROMPT_TOKENS = "8000"
AI_MAX_COMPLETION_TOKENS = "2000"
FRONTEND_ORIGIN = "https://app.marginpulse.example.com"
INGEST_EMAIL_ADDRESS = "noreply@marginpulse.example.com"
WHATSAPP_API_VERSION = "v19.0"
AI_INSIGHTS_DAILY_BUDGET_USD = "5.00"
