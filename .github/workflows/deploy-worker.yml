name: Deploy Cloudflare Worker

# Runs `wrangler deploy` automatically whenever backend-cloudflare/ changes
# on main, instead of needing someone to run it by hand.
#
# One-time setup required (not done by this file):
#   GitHub repo → Settings → Secrets and variables → Actions →
#   New repository secret → CLOUDFLARE_API_TOKEN
#   (Cloudflare dashboard → My Profile → API Tokens → Create Token →
#    "Edit Cloudflare Workers" template, scoped to this account.)
#
# Until that secret exists, this workflow will fail at the deploy step —
# it does nothing destructive, it just won't be able to authenticate.

on:
  push:
    branches: [main]
    paths:
      - "backend-cloudflare/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cloudflare
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: mp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/mp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Load schema (Supabase auth stub, then the real schema)
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/ci-bootstrap.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      # Nothing ships unless it typechecks and every security/accuracy test passes.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (security, tenant isolation, billing, reconciliation accuracy)
        run: npm test

      # tsc and unit tests cannot see startup-only failures (e.g. random values in global scope); this can.
      - name: Boot check (real Workers runtime)
        run: npm run boot-check

      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
